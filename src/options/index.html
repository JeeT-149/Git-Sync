<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>GitSync Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="page">
    <header>
      <div>
        <div class="eyebrow">GitSync</div>
        <h1>Settings</h1>
        <p>Everything stays in Chrome storage. GitHub requests go directly to api.github.com.</p>
      </div>
    </header>

    <section class="card">
      <h2>GitHub Connection</h2>
      <p>GitHub authentication and repository selection have been moved to the main GitSync popup.</p>
    </section>

    <section class="card">
      <h2>Sync</h2>
      <label class="switch"><input id="autoSync" type="checkbox"><span>Automatic sync</span></label>
      <label class="switch"><input id="acceptedOnly" type="checkbox"><span>Only sync accepted submissions</span></label>
      <label class="switch"><input id="includeProblemStatement" type="checkbox"><span>Include problem statement in README</span></label>
      <label class="switch"><input id="includeRuntime" type="checkbox"><span>Include runtime</span></label>
      <label class="switch"><input id="includeMemory" type="checkbox"><span>Include memory</span></label>
      <label class="switch"><input id="leetcodeEnabled" type="checkbox"><span>LeetCode enabled</span></label>

      <label>Commit message prefix
        <input id="commitPrefix" value="GitSync">
      </label>
      <label>Optional Root Folder
        <input id="rootFolder" placeholder="DSA">
      </label>
      <div class="actions" style="margin-top: 16px;">
        <button id="save" class="primary">Save settings</button>
      </div>
      <div id="githubStatus" class="status"></div>
    </section>



    <section class="card danger-card">
      <h2>Reset</h2>
      <button id="clear" class="danger">Clear local settings and history</button>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
